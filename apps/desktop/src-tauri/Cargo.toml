[package]
name = "handy-meeting-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "HandyMeeting"

[lib]
name = "handy_meeting_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "HandyMeeting"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.1"
handy-bridge = { path = "../../../crates/handy-bridge", features = ["native-asr"] }
meeting-core = { path = "../../../crates/meeting-core" }
meeting-notes = { path = "../../../crates/meeting-notes" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
anyhow = "=1.0.104"
dirs = "=6.0.0"
arboard = { version = "=3.6.1", default-features = false }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
zeroize = "=1.8.2"
fs2 = "=0.4.3"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "=0.10.9"
semver = "=1.0.27"
url = "=2.5.7"
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
tempfile = "=3.23.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
