[package]
name = "meeting-notes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4"] }
chrono = { version = "=0.4.42", features = ["serde"] }
tokio = { version = "=1.54.1", features = ["rt", "time"] }
tempfile = "=3.23.0"
fs2 = "=0.4.3"
zeroize = "=1.8.2"
icu_normalizer = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.1.2", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
tempfile = "=3.23.0"
tokio = { version = "=1.54.1", features = ["test-util"] }
