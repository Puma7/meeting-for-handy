[package]
name = "meeting-core"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Durable local meeting capture and transcript journals"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde"] }
uuid = { version = "=1.18.1", features = ["v4"] }
tempfile = "=3.23.0"
fs2 = "=0.4.3"
hound = "=3.5.1"
ring = "=0.17.14"
zeroize = "=1.8.2"
rusqlite = { version = "=0.41.0", features = ["bundled", "cache"] }
zip = { version = "=9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"

