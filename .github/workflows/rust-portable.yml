name: Rust portable desktop candidates
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ['Cargo.toml', 'Cargo.lock', '.gitattributes', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'apps/desktop/**', 'platform/**', 'src/**', 'verify.ps1', 'global.json', 'scripts/**', 'licenses/**', 'assets/**', 'LICENSE', 'THIRD_PARTY_NOTICES.txt', '.github/workflows/rust-portable.yml', '.github/workflows/rust.yml']
  workflow_dispatch:
    inputs:
      packages:
        description: Build and verify Linux/Mac candidates (false only reports the plan)
        type: boolean
        default: true
  workflow_call:
    inputs:
      packages:
        type: boolean
        default: true
      version:
        description: Release version from the tag (empty keeps the version in the files)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: rust-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Select complete candidates only when requested or ready for review
        id: plan
        env:
          CI_PACKAGES: ${{ inputs.packages }}
        run: python3 scripts/ci-plan.py
  desktop:
    needs: plan
    if: needs.plan.outputs.packages == 'true'
    name: ${{ matrix.rid }} GUI build and package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            rid: osx-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            rid: osx-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
      - name: Use the version of the release tag
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/set-version.py "$VERSION"
      - name: Install Linux GUI development libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-layer-shell0 libopenblas0 libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libvulkan1 pulseaudio-utils dbus gnome-keyring pulseaudio xvfb x11-utils espeak-ng
      - name: Install pinned Rust tooling
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy --target '${{ matrix.target }}'
      - name: Prepare local pinned npm without global changes
        run: |
          set -euo pipefail
          mkdir -p .build/tools
          npm pack npm@12.2.1 --json --ignore-scripts --pack-destination .build/tools > .build/npm-package.json
          python3 -c 'import json; x=json.load(open(".build/npm-package.json")); assert len(x)==1 and x[0]["integrity"]=="sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ=="'
          npm install --prefix .build/tools/npm-bootstrap --ignore-scripts --no-audit --no-fund --no-save --package-lock=false "$PWD/.build/tools/npm-12.2.1.tgz"
          echo "HANDYMEETING_NPM_CLI=$PWD/.build/tools/npm-bootstrap/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Prepare and inspect the reviewed native SDK
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-rust-portable.py "$RID"
          python3 scripts/prepare-rust-portable.py "$RID" --check-abi
          sdk="$PWD/.build/rust-native-beta2-0.4.1-$RID"
          echo "TRANSCRIBE_DIR=$sdk" >> "$GITHUB_ENV"
          if [[ "$RID" = linux-x64 ]]; then
            echo "LD_LIBRARY_PATH=$sdk/lib" >> "$GITHUB_ENV"
            echo 'RUSTFLAGS=-D warnings -C link-arg=-Wl,-rpath,$ORIGIN/native' >> "$GITHUB_ENV"
          else
            echo "DYLD_LIBRARY_PATH=$sdk/lib" >> "$GITHUB_ENV"
            echo 'RUSTFLAGS=-D warnings -C link-arg=-Wl,-rpath,@executable_path/native' >> "$GITHUB_ENV"
            echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
          fi
      - name: Bind the portable checks to source bytes
        run: |
          set -euo pipefail
          node scripts/rust-artifacts.mjs source-fingerprint > .build/portable-source-before.json
          python3 -m py_compile scripts/prepare-rust-portable.py scripts/rust-portable-artifacts.py
          python3 -m unittest discover -s scripts -p test_rust_portable.py
          python3 -m unittest discover -s scripts -p test_native_download.py
          python3 -m unittest discover -s scripts -p test_worker_memory.py
          python3 -m unittest discover -s scripts -p test_portable_asr.py
          bash -n scripts/package-rust-portable.sh
          bash -n scripts/check-native-credentials.sh
          bash -n scripts/check-linux-virtual-audio.sh
          bash -n scripts/check-gui-smoke.sh
      - name: Verify frontend and bounded portable audio transport
        run: |
          set -euo pipefail
          cargo +1.91.1 fmt --all -- --check
          node "$HANDYMEETING_NPM_CLI" --prefix apps/desktop ci --ignore-scripts --no-audit --no-fund
          node "$HANDYMEETING_NPM_CLI" --prefix apps/desktop test
          node "$HANDYMEETING_NPM_CLI" --prefix apps/desktop run build
          # Keep the no-ASR feature configuration on these same target hosts;
          # sharing the checkout/dependencies avoids a second fresh core matrix.
          cargo +1.91.1 test -p handy-bridge -p meeting-core -p meeting-notes --all-targets --no-default-features --locked
          cargo +1.91.1 clippy -p handy-bridge -p meeting-core -p meeting-notes --all-targets --no-default-features --locked -- -D warnings
          cargo +1.91.1 test --workspace --all-targets --locked --target '${{ matrix.target }}'
          cargo +1.91.1 clippy --workspace --all-targets --locked --target '${{ matrix.target }}' -- -D warnings
      - name: Build the complete Rust Tauri desktop executable
        run: |
          set -euo pipefail
          cargo +1.91.1 build --release --locked --target '${{ matrix.target }}' -p handy-meeting-desktop
          python3 scripts/rust-portable-artifacts.py begin-release '${{ matrix.rid }}' .build/portable-source-before.json
      - name: Check exact release linkage and synthetic import without devices or models
        run: |
          set -euo pipefail
          .build/rust-target/${{ matrix.target }}/release/HandyMeeting --release-checks .build/portable-release-checks
          node scripts/rust-artifacts.mjs source-fingerprint > .build/portable-source-after.json
          python3 -c 'import json; assert json.load(open(".build/portable-source-before.json"))==json.load(open(".build/portable-source-after.json")), "Source changed during portable checks"'
      - name: Transcribe generated speakers with pinned real Handy, then restart and reopen
        # Independent total CI budget. Per-operation deadlines are upper bounds,
        # not additive time allowances; an overly slow sequence must fail closed.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          app='.build/rust-target/${{ matrix.target }}/release/HandyMeeting'
          if [[ "$RUNNER_OS" = Linux ]]; then
            xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- python3 scripts/check-portable-asr.py '${{ matrix.rid }}' "$app" "$TRANSCRIBE_DIR/lib" .build/portable-asr
          else
            python3 scripts/check-portable-asr.py '${{ matrix.rid }}' "$app" "$TRANSCRIBE_DIR/lib" .build/portable-asr
          fi
          node scripts/rust-artifacts.mjs source-fingerprint > .build/portable-source-after-asr.json
          python3 -c 'import json; assert json.load(open(".build/portable-source-before.json"))==json.load(open(".build/portable-source-after-asr.json")), "Source changed during ASR check"'
      - name: Keep only the explicit sanitized ASR verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-portable-asr-${{ matrix.rid }}
          retention-days: 14
          path: .build/portable-asr/checks.json
          if-no-files-found: error
      - name: Check real pactl listing and parec two-track capture with private virtual PulseAudio devices
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo +1.91.1 build --locked --target '${{ matrix.target }}' -p meeting-core --example device_capture
          bash scripts/check-linux-virtual-audio.sh '.build/rust-target/${{ matrix.target }}/debug/examples/device_capture' .build/linux-virtual-audio
      - name: Keep the virtual-audio verdict including startup-gap limits
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-linux-virtual-audio-verdict
          retention-days: 14
          path: .build/linux-virtual-audio/checks.json
          if-no-files-found: error
      - name: Launch the exact release GUI briefly and require a window and clean stop
        run: |
          set -euo pipefail
          app='.build/rust-target/${{ matrix.target }}/release/HandyMeeting'
          if [[ "$RUNNER_OS" = Linux ]]; then
            xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash scripts/check-gui-smoke.sh "$app" .build/gui-smoke 15
          else
            bash scripts/check-gui-smoke.sh "$app" .build/gui-smoke 15
          fi
      - name: Package the checked desktop, prove relocation and verify isolated native credentials
        run: |
          set -euo pipefail
          bash scripts/package-rust-portable.sh '${{ matrix.rid }}' .build/portable-source-after.json .build/portable-release-checks
      - name: Check Debian12 and13 installation and relocated headless CLI
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for distribution in bookworm-slim trixie-slim; do
            docker run --rm -v "$PWD/packages:/candidate:ro" "debian:$distribution" sh -eu -c '
              apt-get update >/dev/null
              apt-get install -y /candidate/*.deb >/dev/null
              version=$(dpkg-query -W handymeeting)
              test -n "$version"
              executable=$(dpkg-query -L handymeeting | sed -n "/\/HandyMeeting$/p")
              test "$(readlink /usr/bin/handymeeting)" = "$executable"
              dpkg-query -W -f="\${Recommends}\n" handymeeting | grep -q "xdg-utils, gnome-keyring"
              # The command link must resolve the bundled native libraries via $ORIGIN.
              handymeeting --release-checks /tmp/handymeeting-release-checks
              cat /tmp/handymeeting-release-checks/release-checks.json
            '
          done
      - name: Keep candidate packages and hashes without publishing a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-desktop-${{ matrix.rid }}
          retention-days: 14
          path: |
            packages/HandyMeeting-*-osx-*.dmg*
            packages/HandyMeeting-*-linux-amd64.deb*
          if-no-files-found: error
      - name: Collect only explicit regular model-free proof files
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/rust-portable-artifacts.py collect-proofs '${{ matrix.rid }}'
      - name: Keep flat model-free proof and ABI requirements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-portable-checks-${{ matrix.rid }}
          include-hidden-files: true
          retention-days: 14
          path: .build/rust-portable-proofs/${{ matrix.rid }}/*.json
# No physical microphone/system capture, cloud call, two-hour test,
# Developer ID, notarization, or public release is claimed by this workflow. The
# Linux PulseAudio check uses a private server with virtual null-sink devices only;
# pinned public model downloads stay in the ASR test's private cache. Generated
# speech tests real CPU recognition; the GUI check proves launch/window only.
